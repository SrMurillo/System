<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Diagnostic Tool v4.02</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Pantalla de Bienvenida con Formulario -->
<div id="overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:999; display:flex; justify-content:center; align-items:center; flex-direction:column; padding:20px;">
    <h2 style="color:#00ff66; margin-bottom:15px; font-family:monospace; text-align:center;">VERIFICACIÓN DE IDENTIDAD</h2>

    <input type="text" id="victim-name" placeholder="Ingresa tu nombre para continuar..." style="padding:12px; width:80%; max-width:300px; background:#051505; border:1px solid #00ff66; color:#fff; font-family:monospace; margin-bottom:15px; outline:none; text-align:center;">

    <button id="start-btn" style="padding:12px 25px; background:#00ff66; color:#000; border:none; font-weight:bold; cursor:pointer; font-family:monospace;">
        INICIAR ESCANEO
    </button>
</div>

<div class="terminal">
    <div class="terminal-header">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <span class="title">bash - root@system-override:~</span>
    </div>

    <div class="terminal-body" id="console">
        <p class="warning">[ALERTA] Conexión no segura detectada...</p>
    </div>

    <div class="progress-container" id="progress-container">
        <p id="progress-text">Extrayendo datos del sistema: 0%</p>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
    </div>
</div>


<script src="script.js?v=2"></script>
</body>
</html>
